version: 1
status: logical-inventory-before-physical-migration
authority:
  architecture: docs/ARCHITECTURE.md
  vision: docs/VISION.md
  decisions: docs/decisions
target_layout:
  source: src/imagent/{interaction,gateway,applications}
  docs: docs/components/{interaction,gateway,applications}
  tests: tests/{interaction,gateway,applications}
inventory:
  current_source_patterns:
    - src/imagent/**/*.py
    - src/imagent/py.typed
    - schemas/v1/*
    - scripts/*
    - agentkit.yml
    - plugins/agentkit/**/*
    - .agents/plugins/*
    - pyproject.toml
    - build-constraints.txt
    - .github/workflows/*.yml
layers:
  interaction:
    purpose: Typed IM interaction contracts, Controller UX, and Channel boundaries.
    may_depend_on: []
  applications:
    purpose: Native Agent contracts, truth normalization, and concrete adapters.
    may_depend_on: [interaction]
  gateway:
    purpose: Composition and orchestration over Interaction and Applications.
    may_depend_on: [interaction, applications]
  engineering:
    purpose: Non-runtime conformance, repository, AgentKit, and release support.
    may_depend_on: [interaction, applications, gateway]
target_documentation:
  runtime_leaf_rule: docs/components/{component-id-with-dots-as-slashes}/{design.md,testing.md}
  engineering_leaf_rule: docs/engineering/{component-leaf}/{design.md,testing.md}
  required_leaf_files: [design.md, testing.md]
architecture_lint:
  internal_package: imagent
  source_root: src
  source_pattern: src/imagent/**/*.py
  symbol_owner_precedence: exact-current-public-export
  split_candidate_policy: require-one-explicit-owner-edge
  formal_facade_policy: declared-reexports-only
  current_import_exceptions:
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: AgentMessage
      reason: Message-event validation consumes the exact Applications-owned message value so nested Thread ancestry cannot diverge from the event envelope.
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: validate_agent_message
      reason: Message-event validation delegates the Applications-owned nested AgentMessage identity invariant.
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: ProjectRef
      reason: Event runtime annotations resolve the Applications-owned resource identity without introducing a second event or resource contract during the mechanical move.
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: ThreadRef
      reason: Event runtime annotations resolve the Applications-owned resource identity without introducing a second event or resource contract during the mechanical move.
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: validate_thread_ref
      reason: Event validation delegates the Applications-owned ThreadRef invariant while preserving runtime validation behavior during the mechanical move.
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: TurnRef
      reason: Event runtime annotations use the Applications-owned nested Turn identity without defining another resource shape.
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: validate_project_ref
      reason: Event validation delegates the required Applications-owned Project ancestry invariant.
    - from: src/imagent/applications/events.py
      to: src/imagent/applications/contract.py
      symbol: validate_turn_ref
      reason: Turn-scoped event validation delegates the Applications-owned nested Turn invariant.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: ApplicationRef
      reason: Application operation runtime annotations resolve the Applications-owned resource identity without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: Page
      reason: Application operation runtime annotations resolve the Applications-owned result value without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: ProjectRef
      reason: Application operation runtime annotations resolve the Applications-owned resource identity without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: ProjectSummary
      reason: Application operation runtime annotations resolve the Applications-owned result value without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: ThreadHistory
      reason: Application operation runtime annotations resolve the Applications-owned history value without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: ThreadRef
      reason: Application operation runtime annotations resolve the Applications-owned resource identity without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: ThreadStatus
      reason: Application operation runtime annotations resolve the Applications-owned status value without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: ThreadSummary
      reason: Application operation runtime annotations resolve the Applications-owned result value without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: TurnCatchup
      reason: Application operation runtime annotations resolve the Applications-owned history value without a duplicate historical model.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: validate_thread_ref
      reason: Application operation validation delegates the Applications-owned ThreadRef invariant while preserving runtime validation behavior during the mechanical move.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: TurnRef
      reason: Application operations use the Applications-owned nested Turn identity without defining a second resource shape.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: validate_project_ref
      reason: Project-scoped operation validation delegates the Applications-owned Project invariant.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: validate_project_summary
      reason: Project operation results delegate the Applications-owned Project summary invariant.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: validate_thread_history
      reason: History operation results delegate recursive Turn and message ancestry validation to the Applications contract owner.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: validate_thread_summary
      reason: Thread operation results delegate the Applications-owned Thread summary identity invariant.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: validate_turn_catchup
      reason: Catch-up operation results delegate recursive Turn and message ancestry validation to the Applications contract owner.
    - from: src/imagent/applications/operations.py
      to: src/imagent/applications/contract.py
      symbol: validate_turn_ref
      reason: Turn-scoped operation validation delegates the Applications-owned nested Turn invariant.
    - from: src/imagent/applications/requests.py
      to: src/imagent/applications/contract.py
      symbol: ApplicationRef
      reason: Application request runtime annotations resolve the Applications-owned resource identity without a duplicate historical model.
    - from: src/imagent/applications/requests.py
      to: src/imagent/applications/contract.py
      symbol: TurnRef
      reason: Application request values use the Applications-owned nested Turn identity without a duplicate resource model.
    - from: src/imagent/applications/requests.py
      to: src/imagent/applications/contract.py
      symbol: validate_turn_ref
      reason: Application request validation delegates the Applications-owned nested Turn invariant.
    - from: src/imagent/applications/adapters/appserver/client/__init__.py
      to: src/imagent/__init__.py
      symbol: __version__
      reason: The current App Server client user-agent reads package release metadata through the root facade; target packaging will inject or relocate that value without an Applications-to-engineering edge.
    - from: src/imagent/interaction/channels/adapters/weixin_ilink.py
      to: src/imagent/__init__.py
      symbol: __version__
      reason: The current Weixin transport user-agent reads package release metadata through the root facade; target packaging will inject or relocate that value without an Interaction-to-engineering edge.
    - from: src/imagent/gateway/routing/bindings.py
      to: src/imagent/gateway/routing/operations.py
      symbol: GatewayOperationType
      reason: Binding operation values temporarily resolve the canonical Gateway discriminator from the operations owner while the later binding physical move removes this leaf cycle.
    - from: src/imagent/gateway/routing/bindings.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _GatewayOperation
      reason: Binding operation values temporarily reuse the canonical private Gateway base; this is not a public re-export or second contract definition and is removed when the binding physical move is complete.
    - from: src/imagent/gateway/routing/bindings.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _GatewayOperationSucceeded
      reason: Binding result values temporarily reuse the canonical private Gateway result base; this is not a public re-export or second contract definition and is removed when the binding physical move is complete.
    - from: src/imagent/gateway/routing/bindings.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _complete_gateway_union
      reason: The finite named facade bootstrap completes the one closed aggregate after binding values load; it is a temporary import-order edge, not a runtime lookup or second union.
    - from: src/imagent/gateway/projection/request_correlation.py
      to: src/imagent/gateway/routing/operations.py
      symbol: GatewayOperationType
      reason: Request-response operation values resolve the canonical private Gateway discriminator from the aggregate owner without defining a second enum or public re-export.
    - from: src/imagent/gateway/projection/request_correlation.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _GatewayOperation
      reason: Request-response operation values reuse the canonical private Gateway base without a compatibility implementation or duplicate aggregate variant.
    - from: src/imagent/gateway/projection/request_correlation.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _GatewayOperationSucceeded
      reason: Request-response result values reuse the canonical private Gateway result base without a compatibility implementation or duplicate aggregate variant.
    - from: src/imagent/gateway/projection/request_correlation.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _complete_gateway_union
      reason: The finite named facade bootstrap completes the one closed aggregate after request-correlation values load; it is not a compatibility implementation or service locator.
    - from: src/imagent/gateway/routing/projection_routes.py
      to: src/imagent/gateway/routing/operations.py
      symbol: GatewayOperationType
      reason: Projection-route operation values resolve the canonical private Gateway discriminator from the aggregate owner without defining a second enum or public re-export.
    - from: src/imagent/gateway/routing/projection_routes.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _GatewayOperation
      reason: Projection-route operation values reuse the canonical private Gateway base without a compatibility implementation or duplicate aggregate variant.
    - from: src/imagent/gateway/routing/projection_routes.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _GatewayOperationSucceeded
      reason: Projection-route result values reuse the canonical private Gateway result base without a compatibility implementation or duplicate aggregate variant.
    - from: src/imagent/gateway/routing/projection_routes.py
      to: src/imagent/gateway/routing/operations.py
      symbol: _complete_gateway_union
      reason: The finite named facade bootstrap completes the one closed aggregate after exact projection-route values load; it is not a runtime lookup or service locator.
dependency_exceptions:
  - from: interaction.controllers.controller-contract
    to: gateway.actions
    reason: The optional Controller annotation receives the exact immutable ConversationActions capability object; it imports no Gateway runtime, store, repository, or adapter.
  - from: interaction.controllers.command-registry
    to: gateway.actions
    reason: Command handlers and the registry share the exact scoped ConversationActions type without exposing Gateway implementation.
  - from: interaction.controllers.common-commands
    to: applications.application-contract
    reason: SDK common command presentation consumes public Application resource and summary values returned by typed actions.
  - from: interaction.controllers.common-commands
    to: applications.capabilities
    reason: SDK common command presentation consumes the public Thread deletion capability value returned by typed actions.
  - from: interaction.controllers.common-commands
    to: applications.operations
    reason: SDK common delete presentation selects the public closed ThreadDeletionMode required by ConversationActions; it never executes an Application operation directly.
  - from: interaction.controllers.common-commands
    to: applications.requests
    reason: SDK common commands construct typed request response values for the Conversation-authorized action.
  - from: interaction.controllers.common-commands
    to: gateway.actions
    reason: SDK common commands consume the exact scoped action surface and never construct low-level Application or Gateway operations.
  - from: interaction.controllers.common-commands
    to: gateway.outcomes
    reason: Common presentation preserves the closed durable action outcome algebra without retrying partial or unknown work.
  - from: interaction.controllers.common-commands
    to: gateway.persistence.state-contracts
    reason: SDK common command presentation consumes the passive scoped ConversationBinding value returned by ConversationActions.
  - from: interaction.controllers.request-presentation
    to: applications.requests
    reason: A typed Controller request presenter consumes the public Application request contract; no Channel or Application implementation dependency is allowed.

components:
  interaction.messages:
    id: interaction.messages
    parent: interaction
    purpose: Define content-bearing inbound and outbound IM message envelopes.
    owns: [message envelopes, text content, content ordering, stable message identity]
    does_not_own: [control intent, native delivery, transcript authority]
    inputs: [native-normalized content facts]
    outputs: [InboundMessage, OutboundMessage, TextContent]
    public_contracts: [InboundMessage, OutboundMessage, Content, TextContent, ConversationRef, MessageRole, Metadata, TextFormat, TextLengthUnit]
    public_exports:
      current: [imagent.interaction.messages:InboundMessage, imagent.interaction.messages:OutboundMessage, imagent.interaction.messages:Content, imagent.interaction.messages:TextContent, imagent.interaction.messages:ConversationRef, imagent.interaction.messages:MessageRole, imagent.interaction.messages:Metadata, imagent.interaction.messages:TextFormat, imagent.interaction.messages:TextLengthUnit]
      target: [imagent.interaction.messages:InboundMessage, imagent.interaction.messages:OutboundMessage, imagent.interaction.messages:Content, imagent.interaction.messages:TextContent, imagent.interaction.messages:ConversationRef, imagent.interaction.messages:MessageRole, imagent.interaction.messages:Metadata, imagent.interaction.messages:TextFormat, imagent.interaction.messages:TextLengthUnit]
    dependencies: [interaction.media]
    state_recovery: Stateless values; stable IDs, never text or timestamps, drive replay identity.
    current_code: [schemas/v1/common.schema.json, schemas/v1/messages.schema.json, src/imagent/interaction/messages.py]
    target_code: [schemas/v1/common.schema.json, schemas/v1/messages.schema.json, src/imagent/interaction/messages.py]
    current_tests: [tests/interaction/test_messages.py, tests/interaction/test_contracts.py]
    target_tests: [tests/interaction/test_messages.py]
    authoritative_docs: [docs/components/interaction/messages/design.md, docs/components/interaction/messages/testing.md, docs/components/contracts/protocol.md]
    adrs: [docs/decisions/0001-contract-and-resource-foundations.md, docs/decisions/0002-design-authority-and-control-boundaries.md]
    gaps: [the language-neutral message schema remains a declared cross-owner union]

  interaction.operations:
    id: interaction.operations
    parent: interaction
    purpose: Preserve the Message/Operation separation and common typed operation result/error vocabulary.
    owns: [control-intent base contracts, operation result discriminants, stable operation errors]
    does_not_own: [product commands, native mutation implementation, Gateway orchestration]
    inputs: [typed operation values]
    outputs: [validated typed operation/result values]
    public_contracts: [OperationResultStatus, ContractError, ContractViolation, OperationErrorCode, operation_error, require_identifier]
    public_exports:
      current: [imagent.interaction.operations:OperationResultStatus, imagent.interaction.operations:ContractError, imagent.interaction.operations:ContractViolation, imagent.interaction.operations:OperationErrorCode, imagent.interaction.operations:operation_error, imagent.interaction.operations:require_identifier]
      target: [imagent.interaction.operations:OperationResultStatus, imagent.interaction.operations:ContractError, imagent.interaction.operations:ContractViolation, imagent.interaction.operations:OperationErrorCode, imagent.interaction.operations:operation_error, imagent.interaction.operations:require_identifier]
    dependencies: [interaction.messages]
    state_recovery: Stateless validation; operation_id is the durable correlation identity.
    current_code: [schemas/v1/common.schema.json, schemas/v1/operations.schema.json, src/imagent/interaction/__init__.py, src/imagent/interaction/operations.py]
    target_code: [schemas/v1/common.schema.json, schemas/v1/operations.schema.json, src/imagent/interaction/__init__.py, src/imagent/interaction/operations.py]
    current_tests: [tests/interaction/test_operations.py]
    target_tests: [tests/interaction/test_operations.py]
    authoritative_docs: [docs/components/interaction/operations/design.md, docs/components/interaction/operations/testing.md, docs/components/contracts/protocol.md]
    adrs: [docs/decisions/0001-contract-and-resource-foundations.md, docs/decisions/0002-design-authority-and-control-boundaries.md]
    gaps: [language-neutral operation schema remains a declared cross-owner union]

  interaction.media:
    id: interaction.media
    parent: interaction
    purpose: Define typed media sources and enforce source, size, media-type, and filesystem trust boundaries.
    owns: [AttachmentContent, AttachmentSource, shared-filesystem root validation, generic file type and byte validation, bounded inline artifact staging mechanics]
    does_not_own: [artifact bytes, durable spool, unrestricted URL fetching, product quota]
    inputs: [typed attachment source, deployment trust root, generic filename and actual transferred bytes]
    outputs: [validated typed attachment location, descriptor-bound rooted bytes, generic content type and normalized suffix]
    public_contracts: [AttachmentContent, LocalPath, RemoteUrl, AttachmentHandle, AttachmentGrouping, AttachmentSource, AttachmentSourceKind, configure_shared_filesystem_root, resolve_local_attachment, read_local_attachment]
    public_exports:
      current: [imagent.interaction.media:AttachmentContent, imagent.interaction.media:LocalPath, imagent.interaction.media:RemoteUrl, imagent.interaction.media:AttachmentHandle, imagent.interaction.media:AttachmentGrouping, imagent.interaction.media:AttachmentSource, imagent.interaction.media:AttachmentSourceKind, imagent.interaction.media:configure_shared_filesystem_root, imagent.interaction.media:resolve_local_attachment, imagent.interaction.media:read_local_attachment]
      target: [imagent.interaction.media:AttachmentContent, imagent.interaction.media:LocalPath, imagent.interaction.media:RemoteUrl, imagent.interaction.media:AttachmentHandle, imagent.interaction.media:AttachmentGrouping, imagent.interaction.media:AttachmentSource, imagent.interaction.media:AttachmentSourceKind, imagent.interaction.media:configure_shared_filesystem_root, imagent.interaction.media:resolve_local_attachment, imagent.interaction.media:read_local_attachment]
    dependencies: []
    state_recovery: Trust configuration is process-local; content lifetime and crash cleanup stay consumer-owned.
    current_code: [schemas/v1/capabilities.schema.json, schemas/v1/deliveries.schema.json, schemas/v1/messages.schema.json, src/imagent/interaction/media.py, src/imagent/interaction/media_staging.py]
    target_code: [schemas/v1/capabilities.schema.json, schemas/v1/deliveries.schema.json, schemas/v1/messages.schema.json, src/imagent/interaction/media.py, src/imagent/interaction/media_staging.py]
    current_tests: [tests/interaction/test_media.py, tests/interaction/test_media_staging.py, tests/interaction/test_contracts.py, tests/interaction/channels/adapters/test_native_channels.py]
    target_tests: [tests/interaction/test_media.py, tests/interaction/test_media_staging.py]
    authoritative_docs: [docs/components/interaction/media/design.md, docs/components/interaction/media/testing.md]
    adrs: [docs/decisions/0003-attachment-sources-and-trust.md, docs/decisions/0011-durable-inbound-admission-before-media.md, docs/decisions/0015-typed-extension-seams-and-composition.md]
    gaps: [mixed delivery validation in the formal delivery contract remains a declared split candidate for its owner-specific move]

  interaction.diagnostics:
    id: interaction.diagnostics
    parent: interaction
    purpose: Own dependency-neutral immutable connection and queue diagnostic contracts.
    owns: [ConnectionDiagnosticState, DiagnosticFailureCode, QueueDiagnosticName, QueueDiagnosticFacts, ConnectionDiagnosticFacts]
    does_not_own: [Channel-scoped facts, native collection/state, aggregation, I/O, callbacks, secrets, free-form errors]
    inputs: [bounded local diagnostic facts]
    outputs: [immutable redacted connection and queue contracts]
    public_contracts: [ConnectionDiagnosticState, DiagnosticFailureCode, QueueDiagnosticName, QueueDiagnosticFacts, ConnectionDiagnosticFacts]
    public_exports:
      current: [imagent.interaction.diagnostics:ConnectionDiagnosticState, imagent.interaction.diagnostics:DiagnosticFailureCode, imagent.interaction.diagnostics:QueueDiagnosticName, imagent.interaction.diagnostics:QueueDiagnosticFacts, imagent.interaction.diagnostics:ConnectionDiagnosticFacts]
      target: [imagent.interaction.diagnostics:ConnectionDiagnosticState, imagent.interaction.diagnostics:DiagnosticFailureCode, imagent.interaction.diagnostics:QueueDiagnosticName, imagent.interaction.diagnostics:QueueDiagnosticFacts, imagent.interaction.diagnostics:ConnectionDiagnosticFacts]
    dependencies: []
    state_recovery: Stateless frozen values; only bounded process-local observations are represented and no identity or error text is retained.
    current_code: [src/imagent/interaction/diagnostics.py]
    target_code: [src/imagent/interaction/diagnostics.py]
    current_tests: [tests/interaction/test_diagnostics.py]
    target_tests: [tests/interaction/test_diagnostics.py]
    authoritative_docs: [docs/components/interaction/diagnostics/design.md, docs/components/interaction/diagnostics/testing.md]
    adrs: [docs/decisions/0014-read-only-diagnostics-surface.md, docs/decisions/0015-typed-extension-seams-and-composition.md]
    gaps: []

  interaction.client-tools:
    id: interaction.client-tools
    parent: interaction
    purpose: Provide stateless local reference clients for consumer-hosted SDK ingress surfaces.
    owns: [local CLI argument parsing, numeric-loopback endpoint validation, scoped credential input, request-scoped local file-to-inline-content encoding, typed ingress response presentation]
    does_not_own: [Gateway delivery semantics, Application implementation, Channel admission, web server, credential store, durable content, spool, outbox, retry scheduler, global registry]
    inputs: [local command arguments, one scoped credential source, explicitly named regular files, typed JSON ingress response]
    outputs: [one synchronous JSON request, formatted response, stable process exit code]
    public_contracts: [main]
    public_exports:
      current: [imagent.interaction.client_tools.send:main]
      target: [imagent.interaction.client_tools.send:main]
    dependencies: []
    state_recovery: Stateless one-shot client; the caller supplies stable delivery identity and Gateway owns all replay and recovery evidence.
    current_code: [src/imagent/interaction/client_tools/__init__.py, src/imagent/interaction/client_tools/send.py]
    target_code: [src/imagent/interaction/client_tools/__init__.py, src/imagent/interaction/client_tools/send.py]
    current_tests: [tests/interaction/client_tools/__init__.py, tests/interaction/client_tools/test_send.py]
    target_tests: [tests/interaction/client_tools/__init__.py, tests/interaction/client_tools/test_send.py]
    authoritative_docs: [docs/components/interaction/client-tools/design.md, docs/components/interaction/client-tools/testing.md]
    adrs: [docs/decisions/0002-design-authority-and-control-boundaries.md, docs/decisions/0003-attachment-sources-and-trust.md, docs/decisions/0006-core-admission-and-policy-ownership.md, docs/decisions/0009-proactive-delivery-routing.md]
    gaps: []


  interaction.controllers.controller-contract:
    id: interaction.controllers.controller-contract
    parent: interaction.controllers
    purpose: Define the optional typed Controller and lifecycle over the exact scoped ConversationActions surface.
    owns: [InboundController, CommandInvocationFacts, ControllerLifecycle, typed Controller result contract]
    does_not_own: [consumer actions, command grammar, product services, Gateway implementation]
    inputs: [InboundMessage, exact ConversationActions, private one-way effectful-command fence bound to the owned inbound claim]
    outputs: [unconsumed marker or bounded OutboundMessage tuple]
    public_contracts: [InboundController, CommandInvocationFacts, ControllerLifecycle]
    public_exports:
      current: [imagent.interaction.controllers:InboundController, imagent.interaction.controllers:CommandInvocationFacts, imagent.interaction.controllers:ControllerLifecycle]
      target: [imagent.interaction.controllers:InboundController, imagent.interaction.controllers:CommandInvocationFacts, imagent.interaction.controllers:ControllerLifecycle]
    dependencies: [interaction.messages, gateway.actions]
    state_recovery: Controller invocation has no durable authority; action-specific replay fences remain explicit.
    current_code: [src/imagent/interaction/controllers/__init__.py, src/imagent/interaction/controllers/contract.py]
    target_code: [src/imagent/interaction/controllers/__init__.py, src/imagent/interaction/controllers/contract.py]
    current_tests: [tests/interaction/controllers/test_contract.py, tests/interaction/controllers/test_registry.py, tests/interaction/controllers/test_optional_controller.py, tests/gateway/test_operations_integration.py]
    target_tests: [tests/interaction/controllers/test_contract.py]
    authoritative_docs: [docs/components/interaction/controllers/controller-contract/design.md, docs/components/interaction/controllers/controller-contract/testing.md]
    adrs: [docs/decisions/0002-design-authority-and-control-boundaries.md, docs/decisions/0006-core-admission-and-policy-ownership.md, docs/decisions/0015-typed-extension-seams-and-composition.md]
    gaps: []

  interaction.controllers.command-registry:
    id: interaction.controllers.command-registry
    parent: interaction.controllers
    purpose: Compose explicit local bounded typed command definitions and freeze them at startup.
    owns: [registry instance, duplicate/alias validation, freeze lifecycle, handler bounds, stable invocation identity, bounded result presentation]
    does_not_own: [global registration, import-time mutation, product services, generic middleware]
    inputs: [typed CommandDefinition values, verified InboundMessage, exact ConversationActions]
    outputs: [typed invocation, handler result, fixed-identity bounded OutboundMessage]
