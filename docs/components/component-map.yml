structural_status:
  orphan_paths: []
  # Public names removed by the Applications facade convergence. The
  # current-to-target delta is intentionally explicit so tests can derive the
  # complete negative import set rather than maintain a second hand list.
  retired_application_public_exports:
    current: []
    target: []
  temporary_external_docs:
    - path: docs/migrations/issue-9-imcodex-owner-transfer.md
      disposition: Remove after downstream ownership evidence is recorded in GitHub issues/PRs.
    - path: docs/migrations/imcodex-followup-blockers.md
      disposition: Remove after the component rollout and final IMCodex migration replace this temporary status evidence.
  formal_facades:
    - path: src/imagent/__init__.py
      owner: engineering.release
      rationale: Stable package/version facade; it must delegate to one implementation per public symbol.
    - path: src/imagent/applications/__init__.py
      owner: applications.application-contract
      rationale: Current public Applications facade; it directly re-exports the complete Application contract family and keeps only the remaining concrete-adapter exports behind their existing finite named facade.
    - path: src/imagent/applications/presentation/__init__.py
      owner: applications.presentation.live-activity
      rationale: Finite Applications presentation facade; it re-exports the live-activity and artifact-materialization leaves exactly and retains no runtime or compatibility implementation.
    - path: src/imagent/gateway/__init__.py
      owner: gateway.composition
      rationale: Finite v1 Gateway facade; it exposes only Gateway, construction values, scoped actions, read outcomes, and typed input binding failures as exact lazy owner values.
    - path: src/imagent/gateway/persistence/__init__.py
      owner: gateway.persistence.gateway-store
      rationale: Gateway persistence facade; the coherent public GatewayStore and built-in stores are lazy exact exports, while existing focused repository contracts and the idempotency reference implementation remain exact re-exports from their owners.
    - path: src/imagent/gateway/input/__init__.py
      owner: gateway.input.failure-presentation
      rationale: Gateway input facade re-exports exact I1, dispatch, and I2 public contracts from their focused implementations without retaining historical modules.
    - path: src/imagent/gateway/routing/__init__.py
      owner: gateway.routing.gateway-operations
      rationale: Gateway routing facade re-exports exact binding-owner, projection-route-owner, and aggregate-operation-owner contracts, including canonical aggregate validators, without exposing the private executor or retaining a compatibility implementation. The finite imagent.gateway package facade does not export aggregate Gateway operations or validators.
    - path: src/imagent/gateway/projection/__init__.py
      owner: gateway.projection.recovery
      rationale: Gateway projection facade re-exports exact public contracts from focused observation, checkpoint, request-correlation, and recovery leaves without implementing any leaf.
    - path: src/imagent/interaction/controllers/__init__.py
      owner: interaction.controllers.controller-contract
      rationale: Sole Interaction Controller facade; contract, registry, and presentation names bind eagerly while the finite cached common-command pair resolves exact owner objects only on demand, so Gateway composition does not load common behavior and no implementation lives here.
    - path: src/imagent/channels/__init__.py
      owner: interaction.channels.adapters
      rationale: Sole public native-adapter facade; it delegates to the adapters runtime owner and retains no transport implementation or Channel contract values.
