structural_status:
  orphan_paths: []
  temporary_external_docs:
    - path: docs/migrations/issue-9-imcodex-owner-transfer.md
      disposition: Remove after downstream ownership evidence is recorded in GitHub issues/PRs.
    - path: docs/migrations/imcodex-followup-blockers.md
      disposition: Remove after the component rollout and final IMCodex migration replace this temporary status evidence.
  formal_facades:
    - path: src/imagent/__init__.py
      owner: engineering.release
      rationale: Stable package/version facade; it must delegate to one implementation per public symbol.
    - path: src/imagent/applications/__init__.py
      owner: applications.application-contract
      rationale: Current public Applications facade; exports move with their owning leaves without retaining old implementations.
    - path: src/imagent/contracts/__init__.py
      owner: engineering.release
      rationale: Deliberate cross-layer public contract facade; every symbol delegates to its mapped owner and no implementation lives here.
    - path: src/imagent/controllers/__init__.py
      owner: interaction.controllers.controller-contract
      rationale: Current public Controller facade; registry/common/request exports move without retaining duplicate implementations.
    - path: src/imagent/interaction/controllers/__init__.py
      owner: interaction.controllers.controller-contract
      rationale: Target Interaction Controller facade; each public symbol delegates to its owning leaf and no implementation lives here.
    - path: src/imagent/channels/__init__.py
      owner: interaction.channels.channel-contract
      rationale: Current public Channel facade; it delegates to the adapters leaf and retains no transport implementation.
    - path: src/imagent/testing/__init__.py
      owner: engineering.testing-and-conformance
      rationale: Stable public conformance facade; implementation moves once and is not duplicated.
  split_candidates:
    schemas/v1/common.schema.json:
      owners: [interaction.messages, interaction.operations, applications.application-contract]
      reason: Shared stable values and errors underpin message, operation, and Application resource contracts.
    schemas/v1/messages.schema.json:
      owners: [interaction.messages, interaction.media, gateway.persistence.state-contracts, applications.application-contract]
      reason: One language-neutral schema currently covers content, attachments, persisted reply correlation policy, and Application input Port values.
    schemas/v1/operations.schema.json:
      owners: [interaction.operations, gateway.routing.bindings, gateway.routing.gateway-operations, gateway.routing.projection-routes, applications.operations, applications.requests]
      reason: The schema union intentionally publishes common, Gateway, and Application operation variants in one versioned document.
    schemas/v1/capabilities.schema.json:
      owners: [interaction.media, interaction.channels.channel-contract, applications.capabilities]
