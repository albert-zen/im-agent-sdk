    adrs: [docs/decisions/0001-contract-and-resource-foundations.md, docs/decisions/0002-design-authority-and-control-boundaries.md]
    gaps: [language-neutral operation schema remains a declared cross-owner union; deliberate imagent.contracts facade reexports the target leaf as one formal public surface]

