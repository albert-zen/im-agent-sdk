version: 1
status: logical-inventory-before-physical-migration
authority:
  architecture: docs/ARCHITECTURE.md
  vision: docs/VISION.md
  decisions: docs/decisions
target_layout:
  source: src/imagent/{interaction,gateway,applications}
  docs: docs/components/{interaction,gateway,applications}
  tests: tests/{interaction,gateway,applications}
inventory:
  current_source_patterns:
    - src/imagent/**/*.py
    - src/imagent/py.typed
    - schemas/v1/*
    - scripts/*
    - agentkit.yml
    - plugins/agentkit/**/*
    - .agents/plugins/*
    - pyproject.toml
    - .github/workflows/*.yml
layers:
  interaction:
    purpose: Typed IM interaction contracts, Controller UX, and Channel boundaries.
    may_depend_on: []
  applications:
    purpose: Native Agent contracts, truth normalization, and concrete adapters.
    may_depend_on: [interaction]
  gateway:
    purpose: Composition and orchestration over Interaction and Applications.
    may_depend_on: [interaction, applications]
  engineering:
    purpose: Non-runtime conformance, repository, AgentKit, and release support.
    may_depend_on: [interaction, applications, gateway]
target_documentation:
  runtime_leaf_rule: docs/components/{component-id-with-dots-as-slashes}/{design.md,testing.md}
  engineering_leaf_rule: docs/engineering/{component-leaf}/{design.md,testing.md}
  required_leaf_files: [design.md, testing.md]
architecture_lint:
  internal_package: imagent
  source_root: src
  source_pattern: src/imagent/**/*.py
  symbol_owner_precedence: exact-current-public-export
  split_candidate_policy: require-one-explicit-owner-edge
  formal_facade_policy: declared-reexports-only
  current_import_exceptions:
    - from: src/imagent/adapters.py
      to: src/imagent/contracts/__init__.py
      symbol: GatewayOperation
      reason: The historical Channel OperationHandler names GatewayOperation; the Interaction mechanical slice replaces it with the approved Interaction operation boundary.
    - from: src/imagent/applications/appserver_client/__init__.py
      to: src/imagent/__init__.py
      symbol: __version__
      reason: The current App Server client user-agent reads package release metadata through the root facade; target packaging will inject or relocate that value without an Applications-to-engineering edge.
    - from: src/imagent/channels/native/weixin_ilink.py
      to: src/imagent/__init__.py
      symbol: __version__
      reason: The current Weixin transport user-agent reads package release metadata through the root facade; target packaging will inject or relocate that value without an Interaction-to-engineering edge.
    - from: src/imagent/channels/runtime.py
      to: src/imagent/contracts/__init__.py
      symbol: SupportLevel
      reason: The historical Channel capability adapter reuses the Application capability enum; the Interaction mechanical slice replaces it with an Interaction-owned delivery support value without adding an Interaction-to-Applications dependency.
dependency_exceptions:
  - from: interaction.controllers.controller-contract
    to: applications.operations
    reason: ControllerActions exposes the typed Application operation/result Port without importing an Application implementation.
  - from: interaction.controllers.controller-contract
    to: gateway.routing.gateway-operations
    reason: ControllerActions exposes the typed Gateway operation/result Port without importing Gateway orchestration.
  - from: interaction.controllers.controller-contract
    to: gateway.persistence.state-contracts
    reason: ControllerActions returns the passive ConversationBinding value for product-neutral Controller decisions.
  - from: interaction.controllers.common-commands
    to: applications.application-contract
    reason: SDK common command presentation consumes public Application resource and summary values returned by typed actions.
  - from: interaction.controllers.common-commands
    to: applications.capabilities
    reason: SDK common command presentation consumes the public Thread deletion capability value returned by typed actions.
  - from: interaction.controllers.common-commands
    to: applications.operations
    reason: SDK common commands construct public typed Application operations through ControllerActions.
  - from: interaction.controllers.common-commands
    to: applications.requests
    reason: SDK common commands construct public typed request responses and consume RequestRef values through ControllerActions.
  - from: interaction.controllers.common-commands
    to: gateway.routing.bindings
    reason: SDK common commands construct public typed Conversation binding operations through ControllerActions.
  - from: interaction.controllers.common-commands
    to: gateway.routing.gateway-operations
    reason: SDK common commands construct public typed Gateway operations through ControllerActions.
  - from: interaction.controllers.common-commands
    to: gateway.routing.projection-routes
    reason: SDK common commands construct the public typed Thread observation operation through ControllerActions.
  - from: interaction.controllers.common-commands
    to: gateway.projection.request-correlation
    reason: SDK common commands construct the public typed request-routing operation through ControllerActions.
  - from: interaction.controllers.common-commands
    to: gateway.persistence.state-contracts
    reason: SDK common command presentation consumes the passive ConversationBinding returned by ControllerActions.
  - from: interaction.controllers.request-presentation
    to: applications.requests
    reason: A typed Controller request presenter consumes the public Application request contract; no Channel or Application implementation dependency is allowed.

components:
  interaction.messages:
    id: interaction.messages
    parent: interaction
    purpose: Define content-bearing inbound, outbound, and canonical Agent message envelopes.
    owns: [message envelopes, text content, content ordering, stable message identity]
    does_not_own: [control intent, native delivery, transcript authority]
    inputs: [native-normalized content facts]
    outputs: [InboundMessage, OutboundMessage, AgentMessage, TextContent]
    public_contracts: [InboundMessage, OutboundMessage, AgentMessage, Content, TextContent, ConversationRef, MessageRole, Metadata, TextFormat, TextLengthUnit]
    public_exports:
      current: [imagent.contracts:InboundMessage, imagent.contracts:OutboundMessage, imagent.contracts:AgentMessage, imagent.contracts:Content, imagent.contracts:TextContent, imagent.contracts:ConversationRef, imagent.contracts:MessageRole, imagent.contracts:Metadata, imagent.contracts:TextFormat, imagent.contracts:TextLengthUnit, imagent.interaction.messages:InboundMessage, imagent.interaction.messages:OutboundMessage, imagent.interaction.messages:Content, imagent.interaction.messages:TextContent, imagent.interaction.messages:ConversationRef, imagent.interaction.messages:MessageRole, imagent.interaction.messages:Metadata, imagent.interaction.messages:TextFormat, imagent.interaction.messages:TextLengthUnit]
      target: [imagent.contracts:InboundMessage, imagent.contracts:OutboundMessage, imagent.contracts:AgentMessage, imagent.contracts:Content, imagent.contracts:TextContent, imagent.contracts:ConversationRef, imagent.contracts:MessageRole, imagent.contracts:Metadata, imagent.contracts:TextFormat, imagent.contracts:TextLengthUnit, imagent.interaction.messages:InboundMessage, imagent.interaction.messages:OutboundMessage, imagent.interaction.messages:AgentMessage, imagent.interaction.messages:Content, imagent.interaction.messages:TextContent, imagent.interaction.messages:ConversationRef, imagent.interaction.messages:MessageRole, imagent.interaction.messages:Metadata, imagent.interaction.messages:TextFormat, imagent.interaction.messages:TextLengthUnit]
    dependencies: [interaction.media]
    state_recovery: Stateless values; stable IDs, never text or timestamps, drive replay identity.
    current_code: [schemas/v1/common.schema.json, schemas/v1/messages.schema.json, src/imagent/contracts/model.py, src/imagent/interaction/messages.py]
    target_code: [schemas/v1/common.schema.json, schemas/v1/messages.schema.json, src/imagent/interaction/messages.py]
    current_tests: [tests/interaction/test_messages.py, tests/test_contracts.py]
    target_tests: [tests/interaction/test_messages.py]
    authoritative_docs: [docs/components/interaction/messages/design.md, docs/components/interaction/messages/testing.md, docs/components/contracts/protocol.md]
    adrs: [docs/decisions/0001-contract-and-resource-foundations.md, docs/decisions/0002-design-authority-and-control-boundaries.md]
    gaps: [AgentMessage remains in the mixed model until its Applications-owned ThreadRef dependency can be separated without a cycle; the language-neutral message schema remains a declared cross-owner union]

