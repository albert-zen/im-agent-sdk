version: 1

docs:
  root: docs
  design: docs/VISION.md
  workflow: docs/ARCHITECTURE.md
  decisions: docs/decisions

# AgentKit v1 uses `code` as the generic change-matching field. Source and test
# paths are separated by comments here and by the table in docs/README.md.
# Global intent files are intentionally change inputs for every product
# component so cross-cutting edits cannot pass silently.
components:
  contracts:
    description: Language-neutral resources, messages, operations, capabilities, events, and validation rules.
    code:
      # Global cross-component intent.
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/**
      # Source and schemas.
      - src/imagent/contracts/**
      - schemas/v1/**
      - scripts/validate_schemas.py
      # Tests.
      - tests/test_contracts.py
    docs:
      - docs/components/contracts/design.md
      - docs/components/contracts/protocol.md
      - docs/components/contracts/testing.md
    required_docs:
      - design
      - protocol
      - testing
    keywords:
      - contract
      - schema
      - capability
      - message
      - operation
      - event

  ports:
    description: Python runtime ports for Channel, Agent Application, binding, projection-route, and idempotency implementations.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0001-contract-and-resource-foundations.md
      - docs/decisions/0002-design-authority-and-control-boundaries.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/adapters.py
      - src/imagent/__init__.py
      - src/imagent/py.typed
    docs:
      - docs/components/ports/design.md
      - docs/components/ports/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - port
      - protocol
      - adapter
      - repository

  attachments-and-media:
    description: Explicit attachment sources, shared-filesystem trust, and cross-adapter media materialization boundaries.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0003-attachment-sources-and-trust.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/attachments.py
      - tests/test_attachments.py
    docs:
      - docs/components/attachments-and-media/design.md
      - docs/components/attachments-and-media/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - attachment
      - media
      - artifact
      - local-path

  gateway:
    description: Conversation input routing, typed operation orchestration, binding coordination, and idempotent delivery entry.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0002-design-authority-and-control-boundaries.md
      - docs/decisions/0004-event-fanout-and-recovery.md
      - docs/decisions/0005-input-activation-and-projection.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/gateway.py
      - tests/test_gateway_operations.py
      - tests/test_gateway_vertical_slice.py
    docs:
      - docs/components/gateway/design.md
      - docs/components/gateway/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - gateway
      - routing
      - binding
      - idempotency

  projections-and-recovery:
    description: Fan-out-safe event observation, Thread projection routing, authoritative reconciliation, and honest cursor recovery.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0004-event-fanout-and-recovery.md
      - docs/decisions/0005-input-activation-and-projection.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/events.py
      - src/imagent/projections.py
      - src/imagent/recovery.py
      - tests/test_event_fanout.py
      - tests/test_projection_routing.py
      - tests/test_recovery.py
    docs:
      - docs/components/projections-and-recovery/design.md
      - docs/components/projections-and-recovery/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - projection
      - recovery
      - replay
      - cursor
      - fanout

  persistence:
    description: Minimal repositories for Conversation bindings, projection routes, and delivery or inbound idempotency.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0004-event-fanout-and-recovery.md
      - docs/decisions/0005-input-activation-and-projection.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/bindings.py
      - src/imagent/storage.py
      - tests/test_bindings.py
      - tests/test_storage.py
    docs:
      - docs/components/persistence/design.md
      - docs/components/persistence/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - persistence
      - storage
      - sqlite
      - repository

  controllers:
    description: Optional common Slash UX, presentation, and product extension seams over typed operations.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0002-design-authority-and-control-boundaries.md
      - docs/decisions/0005-input-activation-and-projection.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/controllers/**
      - tests/test_slash_controller.py
    docs:
      - docs/components/controllers/design.md
      - docs/components/controllers/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - controller
      - slash
      - presenter
      - command

  channel-adapters:
    description: IM admission, normalization, native delivery, media staging, and platform capability translation.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0003-attachment-sources-and-trust.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/channels/**
      - tests/test_imcodex_channels.py
    docs:
      - docs/components/channel-adapters/design.md
      - docs/components/channel-adapters/testing.md
      - docs/components/channel-adapters/adapters/imcodex.md
    required_docs:
      - design
      - testing
    keywords:
      - channel
      - qq
      - telegram
      - feishu
      - weixin

  application-adapters-appserver:
    description: Shared Codex and Zen App Server resource, input, event, history, request, and recovery translation.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0001-contract-and-resource-foundations.md
      - docs/decisions/0002-design-authority-and-control-boundaries.md
      - docs/decisions/0003-attachment-sources-and-trust.md
      - docs/decisions/0004-event-fanout-and-recovery.md
      - docs/decisions/0005-input-activation-and-projection.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/applications/__init__.py
      - src/imagent/applications/appserver.py
      - src/imagent/applications/imcodex_appserver.py
      - tests/test_imcodex_appserver.py
    docs:
      - docs/components/application-adapters/design.md
      - docs/components/application-adapters/testing.md
      - docs/components/application-adapters/adapters/codex.md
      - docs/components/application-adapters/adapters/zen.md
    required_docs:
      - design
      - testing
    keywords:
      - application
      - adapter
      - codex
      - zen

  application-adapters-t3:
    description: T3 Project, Thread, input, polling, event, history, request, and recovery translation.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0001-contract-and-resource-foundations.md
      - docs/decisions/0002-design-authority-and-control-boundaries.md
      - docs/decisions/0003-attachment-sources-and-trust.md
      - docs/decisions/0004-event-fanout-and-recovery.md
      - docs/decisions/0005-input-activation-and-projection.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/applications/__init__.py
      - src/imagent/applications/t3.py
      - src/imagent/applications/t3_client.py
      - tests/test_t3_client.py
    docs:
      - docs/components/application-adapters/design.md
      - docs/components/application-adapters/testing.md
      - docs/components/application-adapters/adapters/t3.md
    required_docs:
      - design
      - testing
    keywords:
      - application
      - adapter
      - t3

  testing-and-conformance:
    description: Reusable fake adapters, contract suites, and cross-adapter honesty checks.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0001-contract-and-resource-foundations.md
      - docs/decisions/0002-design-authority-and-control-boundaries.md
      - docs/decisions/0004-event-fanout-and-recovery.md
      - docs/decisions/0006-core-admission-and-policy-ownership.md
      - src/imagent/testing/**
      - tests/test_adapter_contracts.py
    docs:
      - docs/components/testing-and-conformance/design.md
      - docs/components/testing-and-conformance/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - testing
      - conformance
      - fake
      - contract-test

  repository-maintainability:
    description: AgentKit configuration, repository guidance, CI, provenance, roadmap, and documentation navigation.
    code:
      - .agents/**
      - .github/workflows/**
      - .gitignore
      - AGENTS.md
      - README.md
      - agentkit.yml
      - pyproject.toml
      - uv.lock
      - plugins/agentkit/**
      - scripts/agentkit
      - scripts/agentkit.cmd
      - scripts/agentkit.py
      - scripts/check_doc_links.py
      - tests/test_agentkit_mapping.py
      - docs/README.md
      - docs/REUSE.md
      - docs/ROADMAP.md
      - docs/decisions/**
      - docs/architecture/**
      - docs/components/repository-maintainability/**
    docs:
      - docs/components/repository-maintainability/design.md
      - docs/components/repository-maintainability/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - agentkit
      - maintainability
      - documentation
      - ci
      - provenance

layers:
  contracts:
    paths:
      - src/imagent/contracts/**
    may_import: []
  ports:
    paths:
      - src/imagent/adapters.py
    may_import:
      - contracts
  media:
    paths:
      - src/imagent/attachments.py
    may_import:
      - contracts
  eventing:
    paths:
      - src/imagent/events.py
    may_import: []
  state:
    paths:
      - src/imagent/bindings.py
      - src/imagent/projections.py
      - src/imagent/storage.py
    may_import:
      - contracts
      - ports
  recovery:
    paths:
      - src/imagent/recovery.py
    may_import:
      - contracts
      - ports
      - eventing
  controllers:
    paths:
      - src/imagent/controllers/**
    may_import:
      - contracts
  channel_adapters:
    paths:
      - src/imagent/channels/**
    may_import:
      - contracts
      - ports
      - media
  application_adapters:
    paths:
      - src/imagent/applications/**
    may_import:
      - contracts
      - media
      - eventing
  gateway:
    paths:
      - src/imagent/gateway.py
    may_import:
      - contracts
      - ports
      - state
      - recovery
      - controllers
  testing:
    paths:
      - src/imagent/testing/**
    may_import:
      - contracts
      - ports
      - eventing

review:
  require_for:
    - public_api
    - data_model
    - architecture
    - gateway
    - recovery
    - adapter
  default: warn

skills:
  source: plugins/agentkit/skills/agentkit/SKILL.md
  output: plugins/agentkit/skills/agentkit/SKILL.md

maintainability:
  budgets:
    - name: gateway-orchestration
      paths:
        - src/imagent/gateway.py
      max_lines: 900
      max_functions: 35
      max_classes: 4
      mode: warn
      guidance: Keep Gateway focused on orchestration; extract delivery planning or component-owned policy before adding more branches.
    - name: application-adapter-modules
      paths:
        - src/imagent/applications/appserver.py
        - src/imagent/applications/t3.py
      max_lines: 1100
      max_functions: 45
      max_classes: 5
      mode: warn
      guidance: Keep native translation cohesive; split protocol clients or pure mapping helpers when a native adapter grows beyond one reviewable unit.
    - name: focused-bridge-modules
      paths:
        - src/imagent/storage.py
        - src/imagent/controllers/slash.py
        - src/imagent/contracts/validators.py
      max_lines: 700
      max_functions: 40
      max_classes: 6
      mode: warn
      guidance: Preserve one clear responsibility per module and avoid mixing product policy with common bridge behavior.
