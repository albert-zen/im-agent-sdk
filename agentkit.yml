version: 1

docs:
  root: docs
  design: docs/VISION.md
  workflow: docs/ARCHITECTURE.md
  decisions: docs/decisions

# AgentKit v1 uses `code` as the generic change-matching field. Source and test
# paths are separated by comments here and by the table in docs/README.md.
# Global intent files are intentionally change inputs for every product
# component so cross-cutting edits cannot pass silently.
components:
  contracts:
    description: Language-neutral resources, messages, operations, capabilities, events, and validation rules.
    code:
      # Global cross-component intent.
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/**
      # Source and schemas.
      - src/imagent/contracts/errors.py
      - src/imagent/contracts/operations.py
      - src/imagent/contracts/validators.py
      - src/imagent/interaction/__init__.py
      - src/imagent/interaction/messages.py
      - src/imagent/interaction/operations.py
      - schemas/v1/*.schema.json
      # Tests.
      - tests/test_contracts.py
      - tests/interaction/__init__.py
      - tests/interaction/test_messages.py
      - tests/interaction/test_operations.py
    docs:
      - docs/components/interaction/README.md
      - docs/components/interaction/messages/design.md
      - docs/components/interaction/messages/testing.md
      - docs/components/interaction/operations/design.md
      - docs/components/interaction/operations/testing.md
      - docs/components/interaction/media/design.md
      - docs/components/interaction/media/testing.md
      - docs/components/contracts/design.md
      - docs/components/contracts/protocol.md
      - docs/components/contracts/testing.md
    required_docs:
      - design
      - protocol
      - testing
    keywords:
      - contract
      - schema
      - capability
      - message
      - operation
      - event

  ports:
    description: Python runtime ports for Channel, Agent Application, binding, projection-route, and idempotency implementations.
    code:
      - docs/VISION.md
      - docs/ARCHITECTURE.md
      - docs/decisions/README.md
      - docs/decisions/0001-contract-and-resource-foundations.md
