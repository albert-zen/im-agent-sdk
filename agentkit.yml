layers:
  diagnostics:
    paths:
      - src/imagent/diagnostics.py
    may_import: []
  contracts:
    paths:
      - src/imagent/contracts/**
    may_import: []
  ports:
    paths:
      - src/imagent/adapters.py
    may_import:
      - contracts
  coordination:
    paths:
      - src/imagent/keyed_locks.py
      - src/imagent/delivery_coordination.py
      - src/imagent/delivery_planning.py
    may_import:
      - contracts
      - ports
  media:
    paths:
      - src/imagent/attachments.py
    may_import:
      - contracts
  eventing:
    paths:
      - src/imagent/events.py
    may_import: []
  state:
    paths:
      - src/imagent/bindings.py
      - src/imagent/delivery_submissions.py
      - src/imagent/projections.py
      - src/imagent/request_correlations.py
      - src/imagent/sqlite_rows.py
      - src/imagent/storage.py
    may_import:
      - contracts
      - ports
  recovery:
    paths:
      - src/imagent/projection_routes.py
      - src/imagent/projection_runtime.py
      - src/imagent/request_projection_runtime.py
      - src/imagent/recovery.py
    may_import:
      - contracts
      - ports
      - eventing
      - state
      - controllers
  controllers:
    paths:
      - src/imagent/controllers/**
    may_import:
      - contracts
  channel_adapters:
    paths:
      - src/imagent/channels/**
    may_import:
      - contracts
      - ports
      - media
  application_adapters:
    paths:
      - src/imagent/applications/**
    may_import:
      - contracts
      - media
      - eventing
      - diagnostics
  gateway:
    paths:
      - src/imagent/inbound_admission.py
      - src/imagent/gateway.py
      - src/imagent/delivery_ingress.py
      - src/imagent/proactive_delivery.py
      - src/imagent/cli/**
    may_import:
      - contracts
      - ports
      - state
      - recovery
      - controllers
      - coordination
      - diagnostics
  testing:
    paths:
      - src/imagent/testing/**
    may_import:
      - contracts
      - ports
      - eventing

review:
  require_for:
    - public_api
    - data_model
    - architecture
    - gateway
    - recovery
    - adapter
  default: warn

skills:
  source: plugins/agentkit/skills/agentkit/SKILL.md
  output: plugins/agentkit/skills/agentkit/SKILL.md

maintainability:
  budgets:
    - name: gateway-orchestration
      paths:
        - src/imagent/gateway.py
      max_lines: 1100
      max_functions: 40
      max_classes: 4
      mode: warn
      guidance: Keep Gateway focused on orchestration; extract delivery planning or component-owned policy before adding more branches.
    - name: application-adapter-modules
      paths:
        - src/imagent/applications/appserver.py
        - src/imagent/applications/t3.py
      max_lines: 1100
      max_functions: 45
      max_classes: 5
      mode: warn
      guidance: Keep native translation cohesive; split protocol clients or pure mapping helpers when a native adapter grows beyond one reviewable unit.
    - name: appserver-native-mapping
      paths:
        - src/imagent/applications/appserver_mapping.py
      max_lines: 225
      max_functions: 22
      max_classes: 1
      mode: warn
      guidance: Keep native response mapping stateless and independently testable; do not add transport, lifecycle, or consumer policy.
    - name: focused-bridge-modules
      paths:
        - src/imagent/projection_routes.py
        - src/imagent/sqlite_rows.py
        - src/imagent/controllers/slash.py
        - src/imagent/contracts/validators.py
      max_lines: 700
      max_functions: 40
      max_classes: 6
      mode: warn
      guidance: Preserve one clear responsibility per module and avoid mixing product policy with common bridge behavior.
    - name: projection-runtime-coordination
      paths:
        - src/imagent/projection_runtime.py
      max_lines: 950
      max_functions: 35
      max_classes: 5
      mode: warn
      guidance: Keep input acceptance, event admission, route barriers, and worker recovery together while they share one per-Thread ordering invariant; extract only across an independently testable state boundary.
    - name: sqlite-gateway-state
      paths:
        - src/imagent/storage.py
      max_lines: 925
      max_functions: 35
      max_classes: 4
      mode: warn
      guidance: Keep repository protocols on one SQLite connection and transaction boundary; extract pure row mapping or an independently owned state boundary before adding more persistence behavior.
    - name: native-channel-transports
      paths:
        - src/imagent/channels/native/qq.py
        - src/imagent/channels/native/qq_quote.py
        - src/imagent/channels/native/telegram.py
        - src/imagent/channels/native/feishu.py
        - src/imagent/channels/native/weixin.py
        - src/imagent/channels/native/weixin_ilink.py
        - src/imagent/channels/native/media.py
      max_lines: 1400
      max_functions: 65
      max_classes: 18
      mode: warn
      guidance: Keep each proven native transport cohesive; split protocol-neutral media or transport mechanics before adding product composition or policy.
    - name: appserver-client-transport
      paths:
        - src/imagent/applications/appserver_client/client.py
      max_lines: 1750
      max_functions: 95
      max_classes: 2
      mode: warn
      guidance: Keep JSON-RPC transport and dispatch reusable; extract a reviewed submodule before adding Application mapping or consumer supervision.
    - name: appserver-wire-transports
      paths:
        - src/imagent/applications/appserver_client/transports.py
      max_lines: 150
      max_functions: 20
      max_classes: 5
      mode: warn
      guidance: Keep wire transports limited to JSON framing, I/O lifecycle, and connection-closed translation.
    - name: appserver-client-diagnostics
      paths:
        - src/imagent/applications/appserver_client/diagnostic_facts.py
      max_lines: 120
      max_functions: 8
      max_classes: 2
      mode: warn
      guidance: Keep diagnostic state bounded, redacted, process-local, and free of transport or recovery ownership.
