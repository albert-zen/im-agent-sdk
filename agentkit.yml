      - docs/decisions/0008-interactive-request-routing.md
      - docs/decisions/0011-durable-inbound-admission-before-media.md
      - docs/decisions/0012-input-continuation-and-reply-correlation.md
      - docs/decisions/0015-typed-extension-seams-and-composition.md
      - src/imagent/adapters.py
    docs:
      - docs/components/ports/design.md
      - docs/components/ports/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - port
      - protocol
      - adapter
      - repository

