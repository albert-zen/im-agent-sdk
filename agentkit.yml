    - gateway
    - recovery
    - adapter
  default: warn

skills:
  source: plugins/agentkit/skills/agentkit/SKILL.md
  output: plugins/agentkit/skills/agentkit/SKILL.md

maintainability:
  budgets:
    - name: gateway-orchestration
      paths:
        - src/imagent/gateway/__init__.py
      max_lines: 1100
      max_functions: 40
      max_classes: 4
      mode: warn
      guidance: Keep Gateway focused on orchestration; extract delivery planning or component-owned policy before adding more branches.
    - name: application-adapter-modules
      paths:
        - src/imagent/applications/adapters/appserver/_base.py
        - src/imagent/applications/adapters/codex.py
        - src/imagent/applications/adapters/zen.py
        - src/imagent/applications/adapters/t3.py
      max_lines: 1800
      max_functions: 65
      max_classes: 8
      mode: warn
      guidance: Keep native translation cohesive; T3 intentionally co-locates its HTTP client and adapter for this physical slice, while future protocol extraction requires a focused ownership decision.
    - name: appserver-native-mapping
      paths:
        - src/imagent/applications/adapters/appserver/mapping.py
      max_lines: 360
      max_functions: 25
      max_classes: 2
      mode: warn
      guidance: Keep native response mapping stateless and independently testable; do not add transport, lifecycle, or consumer policy.
    - name: focused-bridge-modules
      paths:
        - src/imagent/projection_routes.py
        - src/imagent/interaction/controllers/common.py
        - src/imagent/contracts/validators.py
      max_lines: 700
      max_functions: 40
      max_classes: 6
      mode: warn
      guidance: Preserve one clear responsibility per module and avoid mixing product policy with common bridge behavior.
    - name: gateway-row-mapping
      paths:
        - src/imagent/gateway/persistence/row_mapping.py
      max_lines: 700
      max_functions: 40
      max_classes: 2
      mode: warn
      guidance: Keep SQLite row conversion pure, typed, bounded, and independently testable; do not add SQL lifecycle, mutation policy, generic serialization, or durable state.
    - name: projection-runtime-coordination
      paths:
        - src/imagent/projection_runtime.py
      max_lines: 950
      max_functions: 35
      max_classes: 5
      mode: warn
      guidance: Keep input acceptance, event admission, route barriers, and worker recovery together while they share one per-Thread ordering invariant; extract only across an independently testable state boundary.
    - name: sqlite-gateway-state
      paths:
        - src/imagent/storage.py
      max_lines: 925
      max_functions: 35
      max_classes: 4
      mode: warn
      guidance: Keep repository protocols on one SQLite connection and transaction boundary; extract pure row mapping or an independently owned state boundary before adding more persistence behavior.
    - name: native-channel-transports
      paths:
        - src/imagent/interaction/channels/adapters/qq.py
        - src/imagent/interaction/channels/adapters/qq_quote.py
        - src/imagent/interaction/channels/adapters/telegram.py
        - src/imagent/interaction/channels/adapters/feishu.py
        - src/imagent/interaction/channels/adapters/weixin.py
        - src/imagent/interaction/channels/adapters/weixin_ilink.py
        - src/imagent/interaction/channels/ingress_media.py
      max_lines: 1400
      max_functions: 65
      max_classes: 18
      mode: warn
      guidance: Keep each proven native transport cohesive; split protocol-neutral media or transport mechanics before adding product composition or policy.
    - name: appserver-client-transport
      paths:
        - src/imagent/applications/adapters/appserver/client/client.py
      max_lines: 1750
      max_functions: 95
      max_classes: 2
      mode: warn
      guidance: Keep JSON-RPC transport and dispatch reusable; extract a reviewed submodule before adding Application mapping or consumer supervision.
    - name: appserver-wire-transports
      paths:
        - src/imagent/applications/adapters/appserver/transport.py
      max_lines: 150
      max_functions: 20
      max_classes: 5
      mode: warn
      guidance: Keep wire transports limited to JSON framing, I/O lifecycle, and connection-closed translation.
    - name: appserver-client-diagnostics
      paths:
        - src/imagent/applications/adapters/appserver/diagnostics.py
      max_lines: 350
      max_functions: 25
      max_classes: 2
      mode: warn
      guidance: Keep diagnostic state bounded, redacted, process-local, and free of transport or recovery ownership.
