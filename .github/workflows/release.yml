name: GitHub Release

on:
  push:
    tags:
      - "v0.1.0a1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'albert-zen/im-agent-sdk'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.0"

      - name: Verify the release tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - run: uv sync --extra dev --extra channels --extra appserver --locked --no-install-project
      - run: PYTHONPATH=src uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python -m compileall -q src tests scripts
      - run: uv run --no-sync python scripts/validate_schemas.py
      - run: uv run --no-sync python scripts/check_doc_links.py
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync pyright src tests scripts
      - run: python scripts/agentkit.py check
      - run: uv build --wheel --out-dir dist --build-constraint build-constraints.txt --require-hashes
      - run: uv run --no-sync python scripts/smoke_clean_install.py

      - name: Prepare immutable release evidence
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          uv run --no-sync python scripts/prepare_github_release.py \
            --wheel "$wheel" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output-directory dist

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test "$GITHUB_REF_NAME" = "v0.1.0a1"
          read -r object_type object_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0a1" \
              --jq '.object.type + " " + .object.sha'
          )
          for _ in 1 2 3 4 5 6 7 8; do
            case "$object_type" in
              commit)
                break
                ;;
              tag)
                read -r object_type object_sha < <(
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                    --jq '.object.type + " " + .object.sha'
                )
                ;;
              *)
                echo "Release tag resolved to unsupported object type: $object_type" >&2
                exit 1
                ;;
            esac
          done
          test "$object_type" = "commit"
          if [ "$object_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag moved from $GITHUB_SHA to $object_sha; refusing to publish." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$wheel" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "IM Agent SDK ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE_NOTES.md
