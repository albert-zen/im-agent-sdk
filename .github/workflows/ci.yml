name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"

      - run: uv sync --extra dev --extra imcodex --locked
      - run: PYTHONPATH=src uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run python scripts/validate_schemas.py
      - run: uv run python scripts/check_doc_links.py
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright src tests scripts
      - run: ./scripts/agentkit doctor
      - run: ./scripts/agentkit lint-architecture
      - run: ./scripts/agentkit check
