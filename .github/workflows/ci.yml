name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.0"

      - run: uv sync --extra dev --extra channels --extra appserver --locked --no-install-project
      - run: PYTHONPATH=src uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python -m compileall -q src tests scripts
      - run: uv run --no-sync python scripts/validate_schemas.py
      - run: uv run --no-sync python scripts/check_doc_links.py
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync pyright src tests scripts
      - run: uv build --wheel --build-constraint build-constraints.txt --require-hashes
      - run: uv run --no-sync python scripts/smoke_clean_install.py
      - run: ./scripts/agentkit doctor
      - run: ./scripts/agentkit lint-architecture
      - run: ./scripts/agentkit check
