[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "im-agent-sdk"
version = "0.1.0a1"
description = "Unified contracts between IM channels and Agent applications"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Albert Zen" }]
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
appserver = [
  "websockets>=15.0,<16.0",
]
qq = [
  "Pillow>=12.3,<13.0",
  "websockets>=15.0,<16.0",
]
telegram = [
  "Pillow>=12.3,<13.0",
]
feishu = [
  "lark-channel-sdk>=1.1,<2.0",
  "Pillow>=12.3,<13.0",
]
weixin = [
  "Pillow>=12.3,<13.0",
  "pycryptodome>=3.23,<4.0",
]
channels = [
  "lark-channel-sdk>=1.1,<2.0",
  "Pillow>=12.3,<13.0",
  "pycryptodome>=3.23,<4.0",
  "websockets>=15.0,<16.0",
]
dev = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "pyright>=1.1.400",
  "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/albert-zen/im-agent-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/imagent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
